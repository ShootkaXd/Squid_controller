<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/search.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/checkbox.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/blocked_sites.css') }}">
    <title>Заблокированные сайты</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Заблокировать сайт</h2>
            </div>
            <div class="card-body">
                <form method="post" action="/block_site">
                    <div class="form-group">
                        <label for="site_url">URL сайта:</label>
                        <input type="text" class="form-control" name="site_url" id="site_url" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Заблокировать сайт</button>
                </form>
            </div>
        </div>

        <h1>Заблокированные сайты</h1>

        <table>
            <thead>
                <tr>
                    <th>URL сайта</th>
                    <th>Удалить</th>
                </tr>
            </thead>
            <tbody>
                {% for site in blocked_sites %}
                <tr>
                    <td>{{ site[1] }}</td>
                    <td><a href="/remove_site/{{ site[0] }}">Удалить</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
