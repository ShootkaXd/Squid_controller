<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление доступом в Squid</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Squid Access Management</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#block-site">Заблокировать сайт</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/users">Пользователи</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/blocked_sites">Заблокированные сайты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/monitoring">Мониторинг</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/system">Система</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="jumbotron">
        <div class="container">
            <h1 class="display-4">Управление доступом в Squid</h1>
            <p class="lead">Заблокируйте нежелательные сайты и управляйте доступом пользователей.</p>
        </div>
    </div>

    <!-- Block Site Section -->
    <section id="block-site" class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h2>Заблокировать сайт</h2>
            </div>
            <div class="card-body">
                <form method="post" action="/block_site">
                    <div class="form-group">
                        <label for="site_url">URL сайта:</label>
                        <input type="text" class="form-control" name="site_url" id="site_url" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Заблокировать сайт</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Other Sections (Users, Blocked Sites, Monitoring, System) -->

</body>
</html>
