<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление доступом в Squid</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">
            <img src="{{ url_for('static', filename='png/khrunichev_logo.png') }}" alt="Squid Access Management" height="150">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#" data-url="/users">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-url="/blocked_sites">Заблокированные сайты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-url="/siem_events">SIEM (в разработке)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-url="/anomalous_traffic">SIEM вторжение (в разработке)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-url="/monitoring">Мониторинг (в разработке)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-url="/system">О системе (в разработке)</a>
                </li>
            </ul>
        </div>
    </nav>

    <div id="content" class="container">
        <!-- Здесь будет динамически загружаться контент -->
        <div class="jumbotron">
            <div class="container">
                <h1 class="display-4">Управление доступом в Squid</h1>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="footer bg-light text-center mt-5 py-3">
        <div class="container">
            <span class="text-muted">Версия: {{ version }} | Авторы: Shootka, Lermontov</span>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(function() {
            // Функция для загрузки контента через AJAX
            function loadContent(url) {
                $.ajax({
                    url: url,
                    method: 'GET',
                    success: function(data) {
                        $('#content').html(data);
                    },
                    error: function() {
                        $('#content').html('<p>Ошибка загрузки данных</p>');
                    }
                });
            }

            // При нажатии на элемент навигации, загружаем контент
            $('a.nav-link').on('click', function(e) {
                e.preventDefault(); // Отключаем стандартный переход
                var url = $(this).data('url'); // Получаем URL из атрибута data-url
                loadContent(url); // Загружаем контент
            });

            // Загрузка страницы пользователей по умолчанию
            loadContent('/users');
        });
    </script>

</body>
</html>
