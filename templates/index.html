<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление доступом в Squid</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h1 class="mb-0">Заблокировать сайт</h1>
            </div>
            <div class="card-body">
                <form method="post" action="/block_site">
                    <div class="form-group">
                        <label for="site_url">URL сайта:</label>
                        <input type="text" class="form-control" name="site_url" id="site_url" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Заблокировать сайт</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <h2>Пользователи с разрешенным доступом</h2>
        <a class="btn btn-secondary" href="/users">Посмотреть список пользователей</a>
    </div>

    <div class="container mt-4">
        <h2>Заблокированные сайты</h2>
        <a class="btn btn-secondary" href="/blocked_sites">Посмотреть список заблокированных сайтов</a>
    </div>

    <div class="container mt-4">
        <h2>Мониторинг системы</h2>
        <a class="btn btn-secondary" href="/monitoring">Посмотреть монитор системы</a>
    </div>

    <div class="container mt-4">
        <h2>Система</h2>
        <a class="btn btn-secondary" href="/system">Посмотреть систему</a>
    </div>

</body>
</html>
