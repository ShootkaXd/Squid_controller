<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Логи Приложения</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #log-container {
            width: 100%;
            height: 80vh;
            overflow-y: scroll;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        #refresh-button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
    <script>
        // Функция для обновления логов через AJAX
        function refreshLogs() {
            fetch('{{ url_for("logs") }}')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const newLogContent = doc.getElementById('log-container').innerText;
                    document.getElementById('log-container').innerText = newLogContent;
                })
                .catch(err => console.error('Ошибка при обновлении логов:', err));
        }

        // Автоматическое обновление логов каждые 60 секунд
        setInterval(refreshLogs, 60000);
    </script>
</head>
<body>
    <h1>Логи Приложения</h1>
    <div id="log-container">{{ log_content }}</div>
    <button id="refresh-button" onclick="refreshLogs()">Обновить Логи</button>
</body>
</html>
