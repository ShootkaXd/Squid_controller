<!DOCTYPE html>
<html>
<head>
    <title>System Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>System Monitoring</h1>

<canvas id="cpuChart" width="400" height="200"></canvas>
<canvas id="memoryChart" width="400" height="200"></canvas>
<canvas id="networkChart" width="400" height="200"></canvas>

<script>
    // CPU Chart
    var cpuData = {
        labels: ['CPU'],
        datasets: [{
            label: 'CPU Usage',
            data: [{{ cpu_percent }}],
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1
        }]
    };

    var cpuChart = new Chart(document.getElementById('cpuChart').getContext('2d'), {
        type: 'bar',
        data: cpuData
    });

    // Memory Chart
    var memoryData = {
        labels: ['Used', 'Free'],
        datasets: [{
            label: 'Memory Usage',
            data: [{{ memory_info.used }}, {{ memory_info.free }}],
            backgroundColor: ['rgba(255, 99, 132, 0.2)', 'rgba(75, 192, 192, 0.2)'],
            borderColor: ['rgba(255, 99, 132, 1)', 'rgba(75, 192, 192, 1)'],
            borderWidth: 1
        }]
    };

    var memoryChart = new Chart(document.getElementById('memoryChart').getContext('2d'), {
        type: 'bar',
        data: memoryData
    });

    // Network Chart
    var networkData = {
        labels: ['Sent Bytes', 'Received Bytes'],
        datasets: [{
            label: 'Network Traffic',
            data: [{{ sent_bytes }}, {{ received_bytes }}],
            backgroundColor: ['rgba(255, 206, 86, 0.2)', 'rgba(54, 162, 235, 0.2)'],
            borderColor: ['rgba(255, 206, 86, 1)', 'rgba(54, 162, 235, 1)'],
            borderWidth: 1
        }]
    };

    var networkChart = new Chart(document.getElementById('networkChart').getContext('2d'), {
        type: 'bar',
        data: networkData
    });

</script>

</body>
</html>
