<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Monitoring</title>
</head>
<body>
    <h1>Real-time Monitoring</h1>
    <div id="system-info-container">
        <!-- Real-time system information will be displayed here using JavaScript -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <script>
        var socket = io.connect('http://' + document.domain + ':' + location.port);

        socket.on('connect', function() {
            console.log('Connected to server');
        });

        socket.on('system_info_to_client', function(data) {
            updateSystemInfo(data);
        });

        function updateSystemInfo(data) {
            // Update the HTML elements with real-time system information
            // Example: document.getElementById('cpu-percent').innerText = 'CPU Percent: ' + data.cpu_percent + '%';
        }
    </script>
</body>
</html>
