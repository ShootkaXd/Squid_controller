<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Control</title>
</head>
<body>
    <h1>Speed Control</h1>
    <form method="post" action="{{ url_for('speed_control') }}">
        {{ form.csrf_token }}
        {{ form.user_speed.label }}
        {{ form.user_speed }}
        <button type="submit">Apply</button>
    </form>
</body>
</html>
