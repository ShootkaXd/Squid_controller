<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Information</title>

    <!-- Add Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>System Information</h1>

    <!-- Chart containers -->
    <div>
        <canvas id="cpuChart" width="400" height="200"></canvas>
    </div>
    <div>
        <canvas id="memoryChart" width="400" height="200"></canvas>
    </div>
    <div>
        <canvas id="diskChart" width="400" height="200"></canvas>
    </div>
    <div>
        <canvas id="networkChart" width="400" height="200"></canvas>
    </div>

    <script>
        var cpuChart = createChart('cpuChart', 'CPU Usage', '%');
        var memoryChart = createChart('memoryChart', 'Memory Usage', '%');
        var diskChart = createChart('diskChart', 'Disk Usage', '%');
        var networkChart = createChart('networkChart', 'Network Traffic', 'Bytes');

        socket.on('system_info_to_client', function(data) {
            updateSystemInfo(data);
        });

        function updateSystemInfo(data) {
            // Update CPU chart
            updateChart(cpuChart, data.cpu_percent);

            // Update Memory chart
            updateChart(memoryChart, data.memory_percent);

            // Update Disk chart
            updateChart(diskChart, data.disk_percent);

            // Update Network chart
            updateChart(networkChart, data.received_bytes, data.sent_bytes);
        }

        function createChart(canvasId, label, unit) {
            var ctx = document.getElementById(canvasId).getContext('2d');
            var chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        borderColor: 'rgb(75, 192, 192)',
                        data: [],
                        fill: false
                    }]
                },
                options: {
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom'
                        },
                        y: {
                            title: {
                                display: true,
                                text: unit
                            }
                        }
                    }
                }
            });
            return chart;
        }

        function updateChart(chart, ...dataPoints) {
            var labels = chart.data.labels;
            var datasets = chart.data.datasets[0];

            // Limit the number of data points to display
            var maxDataPoints = 10;
            if (labels.length >= maxDataPoints) {
                labels.shift();
                datasets.data.shift();
            }

            // Update labels with a timestamp or any appropriate value
            labels.push(new Date().toLocaleTimeString());

            // Update datasets with new data points
            datasets.data.push(...dataPoints);

            // Update the chart
            chart.update();
        }
    </script>
</body>
</html>
